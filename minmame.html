<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>minmame — workspace</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface-hover: #1c2128;
      --border: #30363d;
      --border-subtle: #21262d;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --text-faint: #484f58;
      --accent: #58a6ff;
      --accent-hover: #79c0ff;
      --success: #3fb950;
      --danger: #f85149;
      --warning: #d29922;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
      --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.5;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      margin: 0 0 20px 0;
      color: var(--text);
    }

    /* Inputs */
    input[type="text"], input[type="password"], input[type="number"] {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      color: var(--text);
      font-size: 13px;
      font-family: var(--font);
      outline: none;
      transition: border-color 0.15s;
      width: 100%;
    }
    input:focus { border-color: var(--accent); }
    input::placeholder { color: var(--text-faint); }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.12s;
      font-family: var(--font);
      white-space: nowrap;
    }
    .btn:hover { background: var(--surface-hover); border-color: var(--text-muted); }
    .btn-primary {
      background: #238636;
      border-color: rgba(46, 160, 67, 0.4);
      color: #fff;
    }
    .btn-primary:hover { background: #2ea043; }
    .btn-danger {
      background: #da3633;
      border-color: rgba(248, 81, 73, 0.4);
      color: #fff;
    }
    .btn-danger:hover { background: #f85149; }
    .btn-sm { padding: 4px 10px; font-size: 12px; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Panels */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .panel-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-subtle);
      font-weight: 600;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .panel-body { padding: 16px; }

    /* Tables */
    .table-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      text-align: left;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-subtle);
      white-space: nowrap;
    }
    th {
      font-weight: 600;
      color: var(--text-muted);
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 1;
    }
    tr:hover td { background: var(--surface-hover); }
    td { color: var(--text); }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      line-height: 1.4;
    }
    .badge-success { background: rgba(46, 160, 67, 0.15); color: var(--success); }
    .badge-danger { background: rgba(248, 81, 73, 0.15); color: var(--danger); }
    .badge-muted { background: rgba(139, 148, 158, 0.15); color: var(--text-muted); }
    .badge-warning { background: rgba(210, 153, 34, 0.15); color: var(--warning); }

    /* Forms */
    .form-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
    .form-group label { font-size: 12px; font-weight: 500; color: var(--text-muted); }
    .form-row {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      flex-wrap: wrap;
    }
    .form-row .form-group { flex: 1; min-width: 180px; margin-bottom: 0; }

    /* Pagination */
    .pagination {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      justify-content: flex-end;
    }
    .pagination-info { color: var(--text-muted); font-size: 12px; margin-right: auto; }

    /* Response box */
    .response-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      margin-top: 12px;
      font-family: var(--font-mono);
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 300px;
      overflow-y: auto;
      display: none;
    }
    .response-box.visible { display: block; }
    .response-box.error { border-color: var(--danger); }
    .response-box.success { border-color: var(--success); }

    /* Master key section */
    .mk-row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .mk-row input { flex: 1; min-width: 200px; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-faint); }

    /* Empty state */
    .empty { color: var(--text-faint); text-align: center; padding: 40px; font-size: 13px; }

    /* Truncate */
    .truncate { max-width: 200px; overflow: hidden; text-overflow: ellipsis; }

    /* Tag cloud */
    .tag-cloud {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>minmame</h1>

    <!-- Master Key -->
    <div class="panel">
      <div class="panel-header">Master Key</div>
      <div class="panel-body">
        <div class="mk-row">
          <input type="password" id="masterKey" placeholder="Enter master key...">
          <button class="btn btn-sm" onclick="saveMasterKey()">Save</button>
          <button class="btn btn-sm" onclick="toggleMkVisibility()" title="Toggle visibility">👁</button>
        </div>
      </div>
    </div>

    <!-- Users -->
    <div class="panel">
      <div class="panel-header">
        <span>Users</span>
        <div style="display:flex;gap:8px;align-items:center;">
          <input type="text" id="users-search" placeholder="Filter username..." style="width:180px;" oninput="filterUsers()">
          <button class="btn btn-sm" onclick="loadUsers()">Refresh</button>
        </div>
      </div>
      <div class="panel-body" style="padding:0;">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Username</th>
                <th>Status</th>
                <th>Google</th>
                <th>Email</th>
                <th>2FA</th>
                <th>Level</th>
                <th>XP</th>
                <th>Warehouse</th>
                <th>Animals</th>
              </tr>
            </thead>
            <tbody id="users-tbody">
              <tr><td colspan="9" class="empty">Click Refresh to load users.</td></tr>
            </tbody>
          </table>
        </div>
        <div class="pagination" id="users-pagination" style="display:none; padding: 12px 16px; border-top: 1px solid var(--border-subtle);">
          <span class="pagination-info" id="users-pag-info"></span>
          <button class="btn btn-sm" id="users-prev" onclick="changePage(-1)">Previous</button>
          <button class="btn btn-sm" id="users-next" onclick="changePage(1)">Next</button>
        </div>
      </div>
      <div id="users-response" class="response-box"></div>
    </div>

    <!-- Banned -->
    <div class="panel">
      <div class="panel-header">
        <span>Banned</span>
        <button class="btn btn-sm" onclick="loadBanned()">Refresh</button>
      </div>
      <div class="panel-body">
        <div class="form-group">
          <label>Banned Usernames</label>
          <div id="banned-users-container"><p class="empty">Click Refresh to load.</p></div>
        </div>
        <div class="form-group" style="margin-top: 16px;">
          <label>Banned Emails</label>
          <div id="banned-emails-container"><p class="empty">Click Refresh to load.</p></div>
        </div>
      </div>
      <div id="banned-response" class="response-box"></div>
    </div>

    <!-- Create User -->
    <div class="panel">
      <div class="panel-header">Create User</div>
      <div class="panel-body" style="max-width: 480px;">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="create-username" placeholder="e.g. farmer_john">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="text" id="create-password" placeholder="min 6 characters">
        </div>
        <button class="btn btn-primary" onclick="createUser()">Create User</button>
        <div id="create-response" class="response-box"></div>
      </div>
    </div>

    <!-- Delete User -->
    <div class="panel">
      <div class="panel-header">Delete User</div>
      <div class="panel-body" style="max-width: 480px;">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="delete-username" placeholder="username to delete">
        </div>
        <button class="btn btn-danger" onclick="deleteUser()">Delete Permanently</button>
        <div id="delete-response" class="response-box"></div>
      </div>
    </div>

    <!-- Reset Password -->
    <div class="panel">
      <div class="panel-header">Reset Password</div>
      <div class="panel-body" style="max-width: 480px;">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="reset-username" placeholder="username">
        </div>
        <div class="form-group">
          <label>New Password</label>
          <input type="text" id="reset-password" placeholder="min 6 characters">
        </div>
        <button class="btn btn-primary" onclick="resetPassword()">Reset Password</button>
        <div id="reset-response" class="response-box"></div>
      </div>
    </div>

    <!-- Disable 2FA -->
    <div class="panel">
      <div class="panel-header">Disable 2FA</div>
      <div class="panel-body" style="max-width: 480px;">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="disable2fa-username" placeholder="username">
        </div>
        <button class="btn btn-danger" onclick="disable2FA()">Disable 2FA</button>
        <div id="disable2fa-response" class="response-box"></div>
      </div>
    </div>

    <!-- Ban -->
    <div class="panel">
      <div class="panel-header">Ban</div>
      <div class="panel-body" style="max-width: 480px;">
        <div class="form-group">
          <label>Username (optional)</label>
          <input type="text" id="ban-username" placeholder="username">
        </div>
        <div class="form-group">
          <label>Email (optional)</label>
          <input type="text" id="ban-email" placeholder="email">
        </div>
        <button class="btn btn-danger" onclick="banUser()">Ban</button>
        <div id="ban-response" class="response-box"></div>
      </div>
    </div>

    <!-- Unban -->
    <div class="panel">
      <div class="panel-header">Unban</div>
      <div class="panel-body" style="max-width: 480px;">
        <div class="form-group">
          <label>Username (optional)</label>
          <input type="text" id="unban-username" placeholder="username">
        </div>
        <div class="form-group">
          <label>Email (optional)</label>
          <input type="text" id="unban-email" placeholder="email">
        </div>
        <button class="btn btn-primary" onclick="unbanUser()">Unban</button>
        <div id="unban-response" class="response-box"></div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin;
    let masterKey = localStorage.getItem('fg_admin_masterKey') || '';
    document.getElementById('masterKey').value = masterKey;

    let usersOffset = 0;
    const usersLimit = 20;
    let usersTotal = 0;
    let usersCache = [];
    let usersFilter = '';

    function saveMasterKey() {
      masterKey = document.getElementById('masterKey').value.trim();
      localStorage.setItem('fg_admin_masterKey', masterKey);
      showResponse('users', 'Master key saved.', 'success');
    }

    function toggleMkVisibility() {
      const el = document.getElementById('masterKey');
      el.type = el.type === 'password' ? 'text' : 'password';
    }

    function showResponse(id, text, type) {
      const el = document.getElementById(id + '-response');
      el.textContent = typeof text === 'string' ? text : JSON.stringify(text, null, 2);
      el.className = 'response-box visible ' + (type || '');
    }

    async function apiPost(path, body) {
      const res = await fetch(API_BASE + path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...body, masterKey }),
      });
      return res.json();
    }

    async function apiGet(path) {
      const res = await fetch(API_BASE + path + '&masterKey=' + encodeURIComponent(masterKey));
      return res.json();
    }

    // --- Users ---
    async function loadUsers() {
      const tbody = document.getElementById('users-tbody');
      tbody.innerHTML = '<tr><td colspan="9" class="empty">Loading...</td></tr>';
      try {
        const data = await apiGet(`/api/admin/users?offset=${usersOffset}&limit=${usersLimit}`);
        if (!data.success) {
          showResponse('users', data.error || 'Failed to load users', 'error');
          tbody.innerHTML = '<tr><td colspan="9" class="empty">Error loading users.</td></tr>';
          return;
        }
        usersCache = data.users || [];
        usersTotal = data.total || 0;
        showResponse('users', `Loaded ${usersCache.length} of ${usersTotal} users`, 'success');
        renderUsers();
      } catch (err) {
        showResponse('users', 'Error: ' + err.message, 'error');
        tbody.innerHTML = '<tr><td colspan="9" class="empty">Error loading users.</td></tr>';
      }
    }

    function filterUsers() {
      usersFilter = document.getElementById('users-search').value.trim().toLowerCase();
      renderUsers();
    }

    function renderUsers() {
      const tbody = document.getElementById('users-tbody');
      let list = usersCache;
      if (usersFilter) {
        list = usersCache.filter(u => u.username.toLowerCase().includes(usersFilter));
      }

      if (!list.length) {
        tbody.innerHTML = '<tr><td colspan="9" class="empty">No users found.</td></tr>';
        updatePagination(0, 0);
        return;
      }

      let html = '';
      for (const u of list) {
        const wh = u.warehouse.map(w => `${w.itemId}×${w.quantity}`).join(', ') || '-';
        const an = u.animals.map(a => a.type).join(', ') || '-';
        const statusBadge = u.banned
          ? '<span class="badge badge-danger">Banned</span>'
          : '<span class="badge badge-success">Active</span>';
        html += `<tr>` +
          `<td>${esc(u.username)}</td>` +
          `<td>${statusBadge}</td>` +
          `<td>${u.googleLinked ? '<span class="badge badge-success">Yes</span>' : '<span class="badge badge-muted">No</span>'}</td>` +
          `<td>${u.email ? esc(u.email) : '<span class="badge badge-muted">—</span>'}</td>` +
          `<td>${u.has2FA ? '<span class="badge badge-warning">On</span>' : '<span class="badge badge-muted">Off</span>'}</td>` +
          `<td>${u.level}</td>` +
          `<td>${u.xp}</td>` +
          `<td class="truncate" title="${esc(wh)}">${esc(trunc(wh, 28))}</td>` +
          `<td>${esc(an)}</td>` +
          `</tr>`;
      }
      tbody.innerHTML = html;
      updatePagination(usersOffset, usersTotal);
    }

    function updatePagination(offset, total) {
      const pag = document.getElementById('users-pagination');
      if (total <= usersLimit && !usersFilter) {
        pag.style.display = 'none';
        return;
      }
      pag.style.display = 'flex';
      document.getElementById('users-pag-info').textContent = `${offset + 1}–${Math.min(offset + usersLimit, total)} of ${total}`;
      document.getElementById('users-prev').disabled = offset <= 0;
      document.getElementById('users-next').disabled = offset + usersLimit >= total;
    }

    function changePage(dir) {
      usersOffset = Math.max(0, usersOffset + dir * usersLimit);
      loadUsers();
    }

    // --- Banned List ---
    async function loadBanned() {
      const uContainer = document.getElementById('banned-users-container');
      const eContainer = document.getElementById('banned-emails-container');
      uContainer.innerHTML = '<p class="empty">Loading...</p>';
      eContainer.innerHTML = '<p class="empty">Loading...</p>';
      try {
        const data = await apiGet('/api/admin/banned-list?');
        if (!data.success) {
          showResponse('banned', data.error || 'Failed to load', 'error');
          uContainer.innerHTML = '<p class="empty">Error.</p>';
          eContainer.innerHTML = '<p class="empty">Error.</p>';
          return;
        }
        const users = data.bannedUsernames || [];
        const emails = data.bannedEmails || [];
        uContainer.innerHTML = users.length
          ? '<div class="tag-cloud">' + users.map(u => `<span class="badge badge-danger">${esc(u)}</span>`).join('') + '</div>'
          : '<p class="empty">No banned users.</p>';
        eContainer.innerHTML = emails.length
          ? '<div class="tag-cloud">' + emails.map(e => `<span class="badge badge-danger">${esc(e)}</span>`).join('') + '</div>'
          : '<p class="empty">No banned emails.</p>';
        showResponse('banned', `Banned: ${users.length} users, ${emails.length} emails`, 'success');
      } catch (err) {
        showResponse('banned', 'Error: ' + err.message, 'error');
      }
    }

    // --- Actions ---
    async function createUser() {
      const username = document.getElementById('create-username').value.trim();
      const password = document.getElementById('create-password').value;
      if (!username || !password) { showResponse('create', 'Username and password required', 'error'); return; }
      try {
        const data = await apiPost('/api/admin/create-user', { username, password });
        showResponse('create', data, data.success ? 'success' : 'error');
        if (data.success) { document.getElementById('create-username').value = ''; document.getElementById('create-password').value = ''; }
      } catch (err) { showResponse('create', 'Error: ' + err.message, 'error'); }
    }

    async function deleteUser() {
      const username = document.getElementById('delete-username').value.trim();
      if (!username) { showResponse('delete', 'Username required', 'error'); return; }
      if (!confirm(`Delete user "${username}" permanently?`)) return;
      try {
        const data = await apiPost('/api/admin/delete-user', { username });
        showResponse('delete', data, data.success ? 'success' : 'error');
        if (data.success) document.getElementById('delete-username').value = '';
      } catch (err) { showResponse('delete', 'Error: ' + err.message, 'error'); }
    }

    async function resetPassword() {
      const username = document.getElementById('reset-username').value.trim();
      const newPassword = document.getElementById('reset-password').value;
      if (!username || !newPassword) { showResponse('reset', 'Username and new password required', 'error'); return; }
      try {
        const data = await apiPost('/api/admin/reset-password', { username, newPassword });
        showResponse('reset', data, data.success ? 'success' : 'error');
        if (data.success) {
          document.getElementById('reset-username').value = '';
          document.getElementById('reset-password').value = '';
        }
      } catch (err) { showResponse('reset', 'Error: ' + err.message, 'error'); }
    }

    async function disable2FA() {
      const username = document.getElementById('disable2fa-username').value.trim();
      if (!username) { showResponse('disable2fa', 'Username required', 'error'); return; }
      if (!confirm(`Disable 2FA for user "${username}"?`)) return;
      try {
        const data = await apiPost('/api/admin/disable-2fa', { username });
        showResponse('disable2fa', data, data.success ? 'success' : 'error');
        if (data.success) document.getElementById('disable2fa-username').value = '';
      } catch (err) { showResponse('disable2fa', 'Error: ' + err.message, 'error'); }
    }

    async function banUser() {
      const username = document.getElementById('ban-username').value.trim() || undefined;
      const email = document.getElementById('ban-email').value.trim() || undefined;
      if (!username && !email) { showResponse('ban', 'Username or email required', 'error'); return; }
      try {
        const data = await apiPost('/api/admin/ban-user', { username, email });
        showResponse('ban', data, data.success ? 'success' : 'error');
        if (data.success) { document.getElementById('ban-username').value = ''; document.getElementById('ban-email').value = ''; }
      } catch (err) { showResponse('ban', 'Error: ' + err.message, 'error'); }
    }

    async function unbanUser() {
      const username = document.getElementById('unban-username').value.trim() || undefined;
      const email = document.getElementById('unban-email').value.trim() || undefined;
      if (!username && !email) { showResponse('unban', 'Username or email required', 'error'); return; }
      try {
        const data = await apiPost('/api/admin/unban-user', { username, email });
        showResponse('unban', data, data.success ? 'success' : 'error');
        if (data.success) { document.getElementById('unban-username').value = ''; document.getElementById('unban-email').value = ''; }
      } catch (err) { showResponse('unban', 'Error: ' + err.message, 'error'); }
    }

    function esc(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }
    function trunc(str, n) { return str.length > n ? str.slice(0, n) + '…' : str; }

    if (masterKey) {
      loadUsers();
      loadBanned();
    }
  </script>
</body>
</html>
